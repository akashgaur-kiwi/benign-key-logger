services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: worknovas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/worknovas?schema=public
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 12h
      AGENT_API_KEY: ${AGENT_API_KEY}
      CORS_ORIGIN: ${APP_URL}
      APP_URL: ${APP_URL}
    ports:
      - "4000:4000"

  # Local/all-in-one only; on AWS the frontend is served by Amplify
  frontend:
    profiles: ["full"]
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "80:80"

volumes:
  pgdata:
