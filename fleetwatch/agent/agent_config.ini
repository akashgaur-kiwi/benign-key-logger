[fleetwatch]
; The address of YOUR server. Use the LAN IP or a domain you control.
server = http://192.168.1.10:8000

; Must match FLEETWATCH_AGENT_TOKEN on the server.
token = CHANGE-ME-agent-shared-secret

; How often to sample the active window (seconds).
sample_seconds = 30

; Mark the user "idle" after this many seconds with no keyboard/mouse input.
idle_seconds = 120

; Send buffered activity after this many samples.
flush_every = 10

; --- Security / data-loss monitoring ---
; How often to scan for USB drives and new files copied to USB / cloud (seconds).
security_seconds = 60

; Extra cloud-sync folders to watch, separated by ';'. Leave blank to use the
; defaults (OneDrive, Google Drive, Dropbox under the user's home folder).
cloud_dirs =

; --- Disclosed periodic screenshots ---
; Seconds between screenshots. 0 = DISABLED (default). e.g. 600 = one every 10 min.
; Only enable this with the monitoring disclosed in CONSENT_NOTICE.txt.
screenshot_seconds = 0

; JPEG quality 1-95 (lower = smaller files, less detail).
screenshot_quality = 40

; --- Remote admin commands (lock / shutdown from your Telegram) ---
; How often the agent checks the server for queued commands (seconds).
command_seconds = 30

; Set to false to disable remote lock/shutdown on this machine.
allow_remote_commands = true
