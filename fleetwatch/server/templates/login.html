{% extends "base.html" %}
{% block title %}Login — FleetWatch{% endblock %}
{% block body %}
<div style="max-width:320px;margin:60px auto;">
  <h2 style="margin-top:0">Admin login</h2>
  {% if err %}<p style="color:#f87171;font-size:13px">{{ err }}</p>{% endif %}
  <form method="post" action="/login">
    <input name="username" placeholder="Username" style="width:100%;padding:10px;margin:6px 0;background:#0f1419;border:1px solid #2a333f;border-radius:6px;color:#e4e8ee">
    <input name="password" type="password" placeholder="Password" style="width:100%;padding:10px;margin:6px 0;background:#0f1419;border:1px solid #2a333f;border-radius:6px;color:#e4e8ee">
    <button style="width:100%;padding:10px;margin-top:8px;background:#60a5fa;border:0;border-radius:6px;color:#0f1419;font-weight:600;cursor:pointer">Sign in</button>
  </form>
</div>
{% endblock %}
