<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FleetWatch{% endblock %}</title>
  <style>
    :root { --bg:#0f1419; --panel:#1a2029; --line:#2a333f; --txt:#e4e8ee; --mut:#8b98a8; --ok:#34d399; --off:#6b7280; --accent:#60a5fa; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); }
    header { background:var(--panel); border-bottom:1px solid var(--line); padding:14px 22px; display:flex; align-items:center; gap:16px; }
    header h1 { font-size:17px; margin:0; letter-spacing:.3px; }
    header a { color:var(--mut); text-decoration:none; font-size:13px; }
    header .sp { flex:1; }
    main { max-width:1100px; margin:0 auto; padding:24px 22px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; text-decoration:none; color:inherit; display:block; }
    .card:hover { border-color:var(--accent); }
    .host { font-weight:600; font-size:15px; margin-bottom:6px; display:flex; align-items:center; gap:8px; }
    .dot { width:9px; height:9px; border-radius:50%; background:var(--off); }
    .dot.on { background:var(--ok); box-shadow:0 0 8px var(--ok); }
    .meta { color:var(--mut); font-size:12.5px; line-height:1.7; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
    th { color:var(--mut); font-weight:600; }
    h2 { font-size:15px; margin:26px 0 12px; }
    .bar { height:7px; background:var(--accent); border-radius:4px; }
    .pill { display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; background:#22303f; color:var(--accent); }
    .back { color:var(--mut); text-decoration:none; font-size:13px; }
  </style>
</head>
<body>
  <header>
    <h1>🛰 FleetWatch</h1>
    <a href="/">Dashboard</a>
    <a href="/attendance">Attendance</a>
    <a href="/security">Security</a>
    <span class="sp"></span>
    <a href="/logout">Log out</a>
  </header>
  <main>{% block body %}{% endblock %}</main>
</body>
</html>
